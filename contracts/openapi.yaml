openapi: 3.0.3
info:
  title: Bloomer Agent API
  version: 1.2.0
  description: |
    Six versioned read-only endpoints and authenticated Darkbloom control endpoints are implemented. Device state is sampled
    independently every 60 seconds and retained for 365 days. Health includes live
    collection, recovery, throttling and cleanup status. A successful response
    may contain stale or partial history, as described by its metadata.
    Data queries read local SQLite and never initiate an upstream collection.
    Alert history and asynchronous Bark test pushes use the same Bearer token.
    Control requests execute allowlisted local CLI commands as serialized background jobs.
    When remote_control_enabled is true (default), the same Bearer token grants control access.
    Browser clients connect directly via Tailscale HTTPS with Authorization: Bearer.
    Every browser origin is allowed via Access-Control-Allow-Origin: * on success and error responses.
    No origin allowlist configuration is required.
    Browser clients use credentials: omit; Access-Control-Allow-Credentials is not enabled.
    OPTIONS preflights for GET/POST and explicit Authorization/Content-Type/Accept need no token
    and return 204; unsupported preflight methods/headers return 403 (cors_forbidden).
    Actual requests always require the independent Bearer token, including requests without Origin.
    Money is an integer number of micro-USD encoded as a decimal string. Record
    IDs are opaque strings. Official lifetime totals and local retained totals
    have different scopes and must not be added across devices for one account.
  x-status: stable
servers:
  - url: http://127.0.0.1:17890
    description: Local loopback; the macOS installer publishes privately through Tailscale Serve
security:
  - bearerAuth: []
paths:
  /v1/alerts:
    get:
      operationId: getAlerts
      summary: Recent 50 alert and recovery notifications, newest first
      description: Reads retained local history even when alert.enabled is false. No query parameters are accepted. No Bark key or server response text is returned.
      responses:
        '200':
          description: Recent notifications and their delivery results
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/AlertRecord'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/alerts/test:
    post:
      operationId: testAlert
      summary: Queue a test Bark push
      description: |
        Requires alert.enabled, an empty request body and no query parameters. Returns
        before network delivery. The active-level test is persisted and retried using
        the same queue as rule alerts; inspect GET /v1/alerts for the result. Disabled
        alerts return 503 with code alerts_disabled. Repeated POSTs create separate tests.
      responses:
        '202':
          description: Test notification durably queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlertRecord'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/device/control:
    get:
      operationId: getDeviceControl
      summary: Remote control availability and recent jobs
      description: |
        enabled reflects remote_control_enabled. available also requires an executable
        Darkbloom CLI and a control manager without a known history failure. Jobs are newest first, capped at 50.
        CLI availability does not imply support for every action or model.
        No query parameters are accepted on control endpoints.
      responses:
        '200':
          description: Control capability and history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/device/control/models:
    get:
      operationId: getControlModels
      summary: Discover local models and the official catalog through the device CLI
      description: |
        Each discovery command has a four second deadline. Partial failure preserves
        the other list. Results contain allowlisted model metadata, never cache paths.
        Presence in either list does not guarantee runtime or memory compatibility.
      responses:
        '200':
          description: Independent local and catalog results
          content:
            application/json:
              schema:
                type: object
                required: [local, catalog]
                properties:
                  local:
                    type: array
                    items:
                      $ref: '#/components/schemas/ControlModel'
                  catalog:
                    type: array
                    items:
                      $ref: '#/components/schemas/ControlModel'
                  local_error:
                    type: string
                    enum: [models_unavailable]
                  catalog_error:
                    type: string
                    enum: [catalog_unavailable]
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Another discovery is in progress (control_busy)
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/device/control/jobs:
    get:
      operationId: getControlJobs
      summary: Recent 50 control jobs, newest first
      responses:
        '200':
          description: Durable control history
          content:
            application/json:
              schema:
                type: object
                required: [jobs]
                properties:
                  jobs:
                    type: array
                    maxItems: 50
                    items:
                      $ref: '#/components/schemas/ControlJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
    post:
      operationId: submitControlJob
      summary: Submit one serialized Darkbloom operation
      description: |
        Saves intent before executing; returns immediately. Same request_id with the
        same ordered selection returns the existing job while retained (last 50 jobs).
        Reusing an ID for different arguments returns request_conflict. There is no
        automatic replay after interruption. One mutation including downloads runs
        at a time. No force mode. Graceful drain budget is 600 seconds; restart
        adds a 180 second startup confirmation. Overall CLI timeout is 15 minutes,
        or 6 hours for download. Timed out/interrupted jobs are unconfirmed and may
        already have affected the provider. Browser disconnect does not cancel a job.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ControlRequest'
      responses:
        '202':
          description: Accepted job or existing job for the same request_id
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ControlJob'
        '400':
          description: Invalid request, model selection, unknown field or query parameter
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Remote control disabled (control_disabled)
        '409':
          description: control_busy or request_conflict
        '415':
          description: Content-Type must be application/json
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/health:
    get:
      operationId: getHealth
      x-implementation-stage: P4
      summary: Process health and collection freshness
      description: |
        Collection is enabled by default; collection_enabled=false disables only
        earnings collection. Device sampling and cleanup remain scheduled.
        Online process health does not imply fresh data.
        Missing history is expressed as null, never a synthetic successful sync.
      responses:
        '200':
          description: Process and database are available
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/device/state:
    get:
      operationId: getDeviceState
      summary: Latest stored device observation, independent of account collection
      description: |
        Returns the newest retained observation by insertion ID. No live probes
        are performed by this request. Null sample means none has been stored.
        Missing metrics are null with explicit quality, never synthetic zero.
      responses:
        '200':
          description: Latest observation and fixed hardware information
          content:
            application/json:
              schema:
                type: object
                required: [device, sample, meta]
                properties:
                  device:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/DeviceIdentity'
                  sample:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/DeviceSample'
                  meta:
                    allOf:
                      - $ref: '#/components/schemas/DeviceMeta'
                      - type: object
                        properties:
                          data_stale:
                            type: boolean
                            description: True if no sample, over 120 seconds old, or future dated
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/device/state/history:
    get:
      operationId: getDeviceStateHistory
      summary: Retained device observations in a UTC time range
      description: |
        Defaults to the last 24 hours. Results are ordered by insertion ID
        descending, including across clock rollbacks. Reuse effective_from and
        effective_to from the initial response with next_before_id for stable
        pagination. Gaps remain gaps; readings are not interpolated.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: before_id
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '200':
          description: Bounded history, available without an earnings snapshot
          content:
            application/json:
              schema:
                type: object
                required: [device, items, next_before_id, meta]
                properties:
                  device:
                    nullable: true
                    allOf:
                      - $ref: '#/components/schemas/DeviceIdentity'
                  items:
                    type: array
                    maxItems: 500
                    items:
                      $ref: '#/components/schemas/DeviceSample'
                  next_before_id:
                    type: integer
                    format: int64
                    nullable: true
                  meta:
                    $ref: '#/components/schemas/DeviceMeta'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/account/overview:
    get:
      operationId: getAccountOverview
      x-implementation-stage: P4
      summary: Official lifetime totals and local retained history
      responses:
        '200':
          description: Latest cached overview, with freshness and partial coverage
          content:
            application/json:
              schema:
                type: object
                required: [account_id, official, local_last_365_days, meta]
                properties:
                  account_id:
                    type: string
                  official:
                    $ref: '#/components/schemas/OfficialSummary'
                  local_last_365_days:
                    type: object
                    required: [record_count, amount_micro_usd]
                    properties:
                      record_count:
                        type: integer
                        format: int64
                        minimum: 0
                      amount_micro_usd:
                        $ref: '#/components/schemas/Money'
                  meta:
                    $ref: '#/components/schemas/DataMetadata'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/earnings:
    get:
      operationId: listEarnings
      x-implementation-stage: P4
      summary: Retained earnings with stable cursor pagination
      description: |
        Order is (created_at_us DESC, record_id DESC), with textual ID ordering.
        Time bounds are [from, to). Default bounds are the last 365 days.
        Cursor freezes the initial upper bound, filters and previous ordering key.
        On later pages effective_from=max(original_from,current_retention_start).
        A narrowed retention range is reported in meta.range_truncated. A cursor
        expires only when its entire time range expires. A prior ordering key
        older than effective_from ends pagination normally. Changed explicit
        filters with a cursor return 400. Refresh to see newly collected records;
        pagination does not provide a database snapshot across requests.
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Model'
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 100
        - name: cursor
          in: query
          description: Opaque, versioned cursor; do not parse or edit
          schema:
            type: string
            maxLength: 4096
      responses:
        '200':
          description: One page of locally retained records
          content:
            application/json:
              schema:
                type: object
                required: [items, next_cursor, meta]
                properties:
                  items:
                    type: array
                    maxItems: 500
                    items:
                      $ref: '#/components/schemas/Earning'
                  next_cursor:
                    type: string
                    nullable: true
                  meta:
                    $ref: '#/components/schemas/DataMetadata'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
  /v1/earnings/stats:
    get:
      operationId: getEarningsStats
      x-implementation-stage: P4
      summary: Aggregate retained earnings by time or model
      description: |
        Uses [from,to), the 365-day retention filter and IANA time zone rules.
        Local days and months are calendar intervals, not fixed 24-hour durations.
        Unobserved intervals must not be interpreted as zero official earnings.
        Rows are streamed with bounded memory and at most 10000 output groups.
        Group keys for repeated local hours include the UTC offset. Missing groups
        are not filled with synthetic zeros. Aggregate amounts use exact integers;
        a final sum outside int64 returns amount_out_of_range (503).
      parameters:
        - $ref: '#/components/parameters/From'
        - $ref: '#/components/parameters/To'
        - $ref: '#/components/parameters/Model'
        - name: group_by
          in: query
          schema:
            type: string
            enum: [hour, day, month, model]
            default: day
        - name: timezone
          in: query
          required: true
          description: IANA time zone name, such as Asia/Shanghai or America/New_York
          schema:
            type: string
            example: Asia/Shanghai
      responses:
        '200':
          description: Cached local aggregates with coverage metadata
          content:
            application/json:
              schema:
                type: object
                required: [group_by, timezone, items, meta]
                properties:
                  group_by:
                    type: string
                    enum: [hour, day, month, model]
                  timezone:
                    type: string
                  items:
                    type: array
                    maxItems: 10000
                    items:
                      type: object
                      required: [key, from, to, record_count, amount_micro_usd]
                      properties:
                        key:
                          type: string
                          description: Local bucket label or model identifier
                        from:
                          type: string
                          format: date-time
                          nullable: true
                          description: UTC bucket start; null for model grouping
                        to:
                          type: string
                          format: date-time
                          nullable: true
                          description: UTC bucket end; null for model grouping
                        record_count:
                          type: integer
                          format: int64
                        amount_micro_usd:
                          $ref: '#/components/schemas/Money'
                  meta:
                    $ref: '#/components/schemas/DataMetadata'
        '400':
          $ref: '#/components/responses/InvalidRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          description: Too many groups; narrow the time range or model filter
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '503':
          $ref: '#/components/responses/Unavailable'
        '504':
          $ref: '#/components/responses/Timeout'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      description: Independent local dashboard access token; never the official token
  parameters:
    From:
      name: from
      in: query
      description: Inclusive RFC3339 instant; clamped to current 365-day retention boundary
      schema:
        type: string
        format: date-time
    To:
      name: to
      in: query
      description: Exclusive RFC3339 instant; defaults to fixed request time
      schema:
        type: string
        format: date-time
    Model:
      name: model
      in: query
      description: Exact model identifier
      schema:
        type: string
  schemas:
    ControlRequest:
      type: object
      additionalProperties: false
      required: [request_id, action]
      properties:
        request_id:
          type: string
          pattern: '^[A-Za-z0-9_-]{16,80}$'
        action:
          type: string
          enum: [start, stop, restart, switch, download]
        models:
          type: array
          maxItems: 16
          uniqueItems: true
          description: |
            start/switch require 1-16 models; download requires exactly one;
            stop/restart require none. Dot/dotdot path segments are rejected.
          items:
            type: string
            pattern: '^[A-Za-z0-9][A-Za-z0-9._/-]{0,199}$'
    ControlJob:
      type: object
      required: [id, request_id, action, status, created_at]
      properties:
        id:
          type: string
        request_id:
          type: string
        action:
          type: string
          enum: [start, stop, restart, switch, download]
        models:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [running, succeeded, failed, unconfirmed]
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        error:
          type: string
          enum: [command_failed, command_timeout, agent_interrupted, history_unavailable]
    ControlStatus:
      type: object
      required: [enabled, available, jobs]
      properties:
        enabled:
          type: boolean
        available:
          type: boolean
        jobs:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/ControlJob'
    ControlModel:
      type: object
      required: [id]
      properties:
        id:
          type: string
        display_name:
          type: string
        size_gb:
          type: number
    DeviceIdentity:
      type: object
      required: [device_id, hardware]
      properties:
        device_id:
          type: string
          description: Installation ID retained with this database; not a verified physical Provider mapping
        hardware:
          type: object
          properties:
            os:
              type: string
            architecture:
              type: string
            model:
              type: string
              nullable: true
            chip:
              type: string
              nullable: true
            logical_cpus:
              type: integer
            memory_total_bytes:
              $ref: '#/components/schemas/DeviceBytes'
    DeviceMeta:
      type: object
      required: [sample_interval_seconds, retention_start, effective_from, effective_to, range_truncated]
      properties:
        sample_interval_seconds:
          type: integer
          enum: [60]
        retention_start:
          type: string
          format: date-time
        effective_from:
          type: string
          format: date-time
        effective_to:
          type: string
          format: date-time
        range_truncated:
          type: boolean
    DeviceNumber:
      type: number
      nullable: true
    DeviceBytes:
      type: integer
      format: int64
      minimum: 0
      nullable: true
    AlertRecord:
      type: object
      required: [id, type, event, level, device_name, title, body, created_at, first_triggered_at, last_push_at, recovered, duration_seconds, delivery_status, attempts, last_attempt_at, next_attempt_at]
      properties:
        id:
          type: integer
          format: int64
        type:
          type: string
          enum: [coordinator_disconnected, connection_flapping, provider_not_running, provider_state_unknown, model_not_ready, no_earnings, test]
        event:
          type: string
          enum: [triggered, reminder, recovered, test]
        level:
          type: string
          enum: [critical, active]
        device_name:
          type: string
        title:
          type: string
        body:
          type: string
          description: Simplified Chinese notification including device, type and Asia/Shanghai start time; recovery includes duration
        created_at:
          type: string
          format: date-time
        first_triggered_at:
          type: string
          format: date-time
        last_push_at:
          type: string
          format: date-time
          nullable: true
          description: Last confirmed successful push for this incident at record creation, or for this notification once delivered
        recovered:
          type: boolean
          description: True for a recovery notification
        duration_seconds:
          type: integer
          format: int64
          minimum: 0
        delivery_status:
          type: string
          enum: [pending, retrying, sent, failed, superseded]
          description: Superseded notifications were replaced by a newer state before delivery
        attempts:
          type: integer
          minimum: 0
          maximum: 4
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        next_attempt_at:
          type: string
          format: date-time
          nullable: true
        error_code:
          type: string
          enum: [bark_send_failed]
    DeviceSample:
      type: object
      required: [id, device_id, collected_at, duration_ms, quality]
      properties:
        id:
          type: integer
          format: int64
        device_id:
          type: string
        collected_at:
          type: string
          format: date-time
        duration_ms:
          type: integer
        cpu_percent:
          $ref: '#/components/schemas/DeviceNumber'
        provider_cpu_percent:
          $ref: '#/components/schemas/DeviceNumber'
        memory_total_bytes:
          $ref: '#/components/schemas/DeviceBytes'
        memory_available_bytes:
          $ref: '#/components/schemas/DeviceBytes'
        memory_pressure:
          type: string
          enum: [normal, warning, critical]
          nullable: true
        swap_used_bytes:
          $ref: '#/components/schemas/DeviceBytes'
        gpu_percent:
          $ref: '#/components/schemas/DeviceNumber'
        cpu_temperature_c:
          $ref: '#/components/schemas/DeviceNumber'
        gpu_temperature_c:
          $ref: '#/components/schemas/DeviceNumber'
        thermal_state:
          type: string
          enum: [nominal, fair, serious, critical]
          nullable: true
        disk_available_bytes:
          $ref: '#/components/schemas/DeviceBytes'
        provider_running:
          type: boolean
          nullable: true
        trust_received_at:
          type: number
          format: double
          nullable: true
          description: trust.received_at as fractional Unix seconds, available only from a fresh state file with a live provider process; used by alerts without changing provider_connected
        session_id:
          type: string
          nullable: true
          description: trust.authorization.session_id from a fresh live daemon snapshot; changes on reconnection and corresponds to the earnings Provider ID
        provider_connected:
          type: boolean
          nullable: true
          description: Legacy unused placeholder; always unknown
        current_model:
          type: string
          nullable: true
        model_ready:
          type: boolean
          nullable: true
          description: Locally loaded current model; does not assert platform routing eligibility
        dispatch_tier:
          type: string
          nullable: true
          deprecated: true
          description: Legacy unused placeholder
        inference_active:
          type: boolean
          nullable: true
          description: Fresh local daemon inference activity; missing or stale remains unknown
        request_work_pending:
          type: boolean
          nullable: true
          description: Fresh local accepted/queued work flag
        is_idle:
          type: boolean
          nullable: true
          description: True only when both local task flags are false and this device latest earning is strictly older than 300 seconds at collection; null when evidence is unavailable or earnings sync is stale
        last_device_earning_at:
          type: string
          format: date-time
          nullable: true
          description: Latest earning for precisely matched local Provider IDs within the bound account; never account-wide
        last_earnings_sync_at:
          type: string
          format: date-time
          nullable: true
        earnings_provider_id:
          type: string
          nullable: true
          description: Provider session owning the latest matched device earning
        activity_error:
          type: string
          nullable: true
          description: Safe reason code for unavailable idle state
        provider_pid:
          type: integer
          nullable: true
        provider_version:
          type: string
          nullable: true
        provider_state_at:
          type: string
          format: date-time
          nullable: true
        quality:
          type: object
          description: Status for every measurement; non-ok readings are null
          additionalProperties:
            type: string
            enum: [ok, unsupported, unavailable, permission_denied, invalid, stale, not_running]
    Money:
      type: string
      pattern: '^-?(0|[1-9][0-9]*)$'
      example: '1234'
      description: Signed integer micro-USD within int64 range, transported without float conversion
    Error:
      type: object
      required: [code, message, request_id]
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
      description: Safe error message; excludes credentials, SQL and upstream response bodies
    Coverage:
      type: object
      required: [status, start, gap_count, gaps, gaps_truncated]
      properties:
        status:
          type: string
          enum: [uninitialized, partial, possible_gap]
          description: A recent upstream window never proves complete lifetime history
        start:
          type: string
          format: date-time
          nullable: true
        gaps_truncated:
          type: boolean
          description: True when only the newest 100 retained gaps are returned
        gaps:
          type: array
          maxItems: 100
          items:
            type: object
            required: [detected_at, from, to, reason]
            properties:
              detected_at:
                type: string
                format: date-time
              from:
                type: string
                format: date-time
              to:
                type: string
                format: date-time
              reason:
                type: string
            description: Observed interruption bounds, not exact bounds of missing earnings
        gap_count:
          type: integer
          format: int64
          minimum: 0
          description: Count of suspected gaps intersecting the current retention range
    DataMetadata:
      type: object
      required: [last_successful_sync_at, data_stale, retention_start, effective_from, effective_to, range_truncated, coverage]
      properties:
        last_successful_sync_at:
          type: string
          format: date-time
          nullable: true
        data_stale:
          type: boolean
          description: No successful sync or more than 120 seconds since last success
        retention_start:
          type: string
          format: date-time
        effective_from:
          type: string
          format: date-time
        effective_to:
          type: string
          format: date-time
        range_truncated:
          type: boolean
        coverage:
          $ref: '#/components/schemas/Coverage'
    Health:
      type: object
      required: [version, phase, schema_version, collection_state, server_time, last_successful_sync_at, data_stale, last_error, retention_start, coverage, cleanup]
      properties:
        version:
          type: string
        phase:
          type: string
          example: P6
        server_time:
          type: string
          format: date-time
          description: Agent current UTC time for browser clock skew correction.
        next_collection_at:
          type: string
          format: date-time
          nullable: true
          description: Planned start of the next earnings collection round; null when collection is disabled or not yet scheduled.
        schema_version:
          type: integer
          minimum: 1
        collection_state:
          type: string
          enum: [disabled, idle, collecting, degraded, rate_limited]
        last_successful_sync_at:
          type: string
          format: date-time
          nullable: true
        data_stale:
          type: boolean
        last_error:
          type: string
          nullable: true
        last_attempt_at:
          type: string
          format: date-time
          nullable: true
        last_clean_shutdown_at:
          type: string
          format: date-time
          nullable: true
        sync_mode:
          type: string
          nullable: true
          enum: [initial, normal, recovery, null]
        recovery_reason:
          type: string
          nullable: true
        retry_not_before:
          type: string
          format: date-time
          nullable: true
        retention_start:
          type: string
          format: date-time
        coverage:
          $ref: '#/components/schemas/Coverage'
        cleanup:
          type: object
          required: [state, last_success_at]
          properties:
            state:
              type: string
              enum: [idle, running, failed]
            last_success_at:
              type: string
              format: date-time
              nullable: true
            last_error:
              type: string
              nullable: true
    OfficialSummary:
      type: object
      required: [record_count, total_micro_usd, available_balance_micro_usd, withdrawable_balance_micro_usd, observed_at]
      properties:
        record_count:
          type: integer
          format: int64
        total_micro_usd:
          $ref: '#/components/schemas/Money'
        available_balance_micro_usd:
          $ref: '#/components/schemas/Money'
        withdrawable_balance_micro_usd:
          $ref: '#/components/schemas/Money'
        observed_at:
          type: string
          format: date-time
    Earning:
      type: object
      required: [account_id, record_id, provider_id, provider_key, job_id, model, amount_micro_usd, prompt_tokens, completion_tokens, created_at]
      properties:
        account_id:
          type: string
        record_id:
          type: string
        provider_id:
          type: string
          description: Original upstream identity; not asserted to be a physical device ID
        provider_key:
          type: string
        job_id:
          type: string
        model:
          type: string
        amount_micro_usd:
          $ref: '#/components/schemas/Money'
        prompt_tokens:
          type: integer
          format: int64
          minimum: 0
        completion_tokens:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
          description: UTC instant with microsecond precision
  responses:
    InvalidRequest:
      description: Invalid time range, filter, time zone or cursor
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: Missing or invalid independent dashboard token
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unavailable:
      description: Local database unavailable, no successful snapshot (data_unavailable), or aggregate outside int64 (amount_out_of_range)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Timeout:
      description: Query exceeded its time budget
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
